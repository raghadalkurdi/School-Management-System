# Render Blueprint: deploys the School Management System on the free tier.
# Data note: the free tier has an ephemeral disk, so the start command
# re-runs migrations and seeders on every boot to keep demo data present.
services:
  - type: web
    name: school-management-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >
      python manage.py migrate --noinput &&
      python _seed_data.py &&
      python _demo_accounts.py &&
      python _bootstrap_admin.py &&
      python manage.py collectstatic --noinput &&
      gunicorn school_management.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 1
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@sms-fake.local
      - key: DJANGO_SUPERUSER_PASSWORD
        value: Admin@SMS-2026!
